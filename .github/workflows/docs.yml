name: Docs

# Builds the documentation site on every change that can affect it, and
# publishes it to GitHub Pages from the default branch.  `mkdocs build --strict`
# fails on a broken link or on a docstring that does not parse.
#
# Publishing needs Pages to be enabled once, with "GitHub Actions" as the
# source (Settings > Pages).  Until then the site is built and checked, and the
# deployment is skipped with a notice instead of failing.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A newer commit on a pull request stops the run of the older one. On a
  # branch a run that has started is allowed to finish, so that a deployment is
  # not cut off half-way; of the runs waiting behind it GitHub keeps the newest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[docs]"
      - name: Build
        run: mkdocs build --strict
      - id: pages
        name: Is GitHub Pages set up for this repository?
        # From the default branch only: that is the branch the github-pages
        # environment accepts deployments from.
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2> error.txt); then
            if [ "$source" = "workflow" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=Site not published::GitHub Pages builds from a branch. Set Settings > Pages > Source to 'GitHub Actions' to publish this site."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "404" error.txt; then
            echo "::notice title=Site not published::GitHub Pages is not enabled. Enable it under Settings > Pages with 'GitHub Actions' as the source to publish this site."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            # not an answer about Pages: let the deployment itself report the problem
            echo "::warning::could not read the Pages settings: $(cat error.txt)"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the site
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time; a newer one waits instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
