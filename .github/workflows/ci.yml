name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these jobs before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # On the oldest and the newest Python: the NumPy releases they get differ
    # in their type stubs, and the annotations have to satisfy both.
    name: Lint and type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  # This job has no `name`: the branch protection of main requires the checks
  # "test (3.10)", "test (3.11)" and "test (3.12)", which is what GitHub calls
  # the entries of a matrix on a job with the id `test`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Show the failures on the summary page
        if: failure()
        run: python tools/annotate_failures.py test-results.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  other-systems:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --junitxml=test-results.xml
      - name: Show the failures on the summary page
        if: failure()
        run: python tools/annotate_failures.py test-results.xml

  oldest-dependencies:
    name: Tests (oldest supported NumPy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the lower bound declared in pyproject.toml
        run: |
          python -m pip install "numpy==1.24.*" "pytest>=8.0"
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m pytest --junitxml=test-results.xml
      - name: Show the failures on the summary page
        if: failure()
        run: python tools/annotate_failures.py test-results.xml

  # Builds the distribution and uses it the way a user would: installed from the
  # wheel into a clean environment, through the `tfu` command, away from the
  # source tree.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
      - name: Run the command line on a generated price file
        working-directory: ${{ runner.temp }}
        run: |
          PATH="$RUNNER_TEMP/wheel-env/bin:$PATH"
          python - <<'PY'
          import numpy as np

          rng = np.random.default_rng(42)
          close = 100 * np.exp(np.cumsum(0.0004 + 0.01 * rng.standard_normal(600)))
          with open("prices.csv", "w") as handle:
              handle.write("close,high,low\n")
              for c in close.tolist():
                  handle.write(f"{c!r},{c * 1.004!r},{c * 0.996!r}\n")
          PY
          tfu --version
          tfu european --csv prices.csv --span-long 50 --span-short 10
          tfu american --csv prices.csv --span-long 50 --span-short 10 --atr-period 20 --q 1 --p 3
          tfu tsmom --csv prices.csv --L 5 --M 8
          python - <<'PY'
          import numpy as np

          import tfunify

          print("tfunify", tfunify.__version__, "from", tfunify.__file__)
          assert "wheel-env" in tfunify.__file__
          for system in ("european", "american", "tsmom"):
              with np.load(f"{system}_results.npz") as results:
                  pnl = results["pnl"]
                  assert pnl.shape == (600,), pnl.shape
                  assert np.all(np.isfinite(pnl))
                  assert np.any(pnl != 0.0), f"{system} never took a position"
                  print(system, sorted(results.files))
          PY
