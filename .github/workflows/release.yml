name: Release

# A release is cut automatically when a commit on main carries a version in
# pyproject.toml that has no tag yet: the tag, the GitHub release (with the
# matching CHANGELOG section as notes) and the built distributions are all
# created here.  To release, bump `version` and add a CHANGELOG section on
# develop, and merge develop into main.  Nothing is published unless every job
# of the CI workflow passes on the commit being released.
#
# The check runs on every push to main (it takes a few seconds) rather than
# only when pyproject.toml changes: with a path filter, a release whose run
# failed could not be retried by the next commit.
#
# Started by hand with `publish_version`, the workflow does one other thing: it
# uploads the files of a version that is already released on GitHub to PyPI.
# That is for the first release after PyPI publishing is switched on.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: >-
          Leave empty to release the version on main if it has no tag yet. To
          upload a version that is already released on GitHub to PyPI, give
          its number (for example 0.2.0).
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Per ref: a run started by hand from another branch (which does nothing)
  # must not displace a pending run on main.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Is there a new version?
    # Never from another branch, even when started by hand.
    if: github.ref == 'refs/heads/main' && inputs.publish_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: version
        name: Compare the declared version with the existing tags
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish v${{ needs.check.outputs.version }}
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python tools/release_notes.py "$VERSION" > release-notes.md
      # Before the release is created: if this upload fails, nothing has been
      # published and the run can simply be started again.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # `gh release create` saves a draft, uploads the files and then
          # publishes, which is what creates the tag. A run that was stopped in
          # between leaves a draft and no tag, so the next run arrives here.
          if draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = "true" ]; then
              echo "Removing the draft left by an interrupted run."
              gh release delete "v$VERSION" --yes
            else
              echo "v$VERSION is published already (this job is being re-run): completing its files."
              gh release upload "v$VERSION" dist/* --clobber
              exit 0
            fi
          fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  pypi:
    name: Publish to PyPI
    needs: [check, release]
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to "true" and
    # register this workflow as a trusted publisher on PyPI (no token needed).
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true # a repeated run does not fail on files already there

  publish-existing:
    name: Publish an existing release to PyPI
    # By hand only, and from main: the files are those attached to the GitHub
    # release of that version, exactly as they were built and tested then.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the files of the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.publish_version }}
        run: |
          gh release download "v${VERSION#v}" --repo "$GITHUB_REPOSITORY" \
            --dir dist --pattern "*.whl" --pattern "*.tar.gz"
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
