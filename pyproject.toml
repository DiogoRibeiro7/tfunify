[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tfunify"
version = "0.2.0"
description = "Trend-following systems in NumPy: European (EWMA), American (breakout with ATR stops) and time-series momentum."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
keywords = ["trend-following", "momentum", "cta", "managed-futures", "quant", "timeseries"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
plot = ["matplotlib>=3.8"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0",
    "ruff>=0.6",              # mkdocstrings formats signatures with it
]
dev = [
    "coverage>=7.2",    # for exclude_also in the configuration below
    "matplotlib>=3.8",
    "mypy>=2.0",
    "pandas>=2.0",      # only for the test of the Yahoo download
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.*",     # pinned to one series: a new one may add rules to the selected sets
]

[project.scripts]
tfu = "tfunify.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/tfunify"
Documentation = "https://diogoribeiro7.github.io/tfunify/"
Issues = "https://github.com/DiogoRibeiro7/tfunify/issues"
Changelog = "https://github.com/DiogoRibeiro7/tfunify/blob/develop/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tfunify"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "tools",
    "docs",
    "mkdocs.yml",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# Warnings raised from this package or its tests are errors; those raised
# inside third-party libraries are not.
filterwarnings = ["error::Warning:tfunify", "error::Warning:tests"]

[tool.coverage.run]
source = ["tfunify"]
branch = true
omit = ["*/tfunify/__main__.py"] # three lines, run in a subprocess by the tests

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "NPY", "PT"]
ignore = [
    "N803", # L and M are the paper's names for the TSMOM parameters
    "N806",
    "N815",
    "B905", # zip() without strict=: the lengths are checked where they can differ
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
