site_name: tfunify
site_description: Trend-following systems in NumPy - European, American and time-series momentum
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/tfunify/
repo_url: https://github.com/DiogoRibeiro7/tfunify
repo_name: DiogoRibeiro7/tfunify
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2025-2026 Diogo Ribeiro &middot; MIT

strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-line
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Systems:
      - systems/index.md
      - European: systems/european.md
      - American: systems/american.md
      - Time-series momentum: systems/tsmom.md
      - Conventions: systems/conventions.md
  - Closed forms: theory.md
  - Command line: cli.md
  - Examples: examples.md
  - Reference:
      - reference/index.md
      - Systems: reference/systems.md
      - Filters and volatility: reference/core.md
      - Closed forms: reference/theory.md
      - Statistics: reference/metrics.md
      - Data: reference/data.md
  - Development:
      - development.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: !relative $config_dir # the build works from any directory
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0001-2022-7072
    - icon: fontawesome/brands/medium
      link: https://medium.com/@diogo-ribeiro-1975
